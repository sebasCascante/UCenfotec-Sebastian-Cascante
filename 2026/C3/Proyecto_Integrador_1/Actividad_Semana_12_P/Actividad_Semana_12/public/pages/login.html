<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca | Iniciar sesión</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <script src="../js/api.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/login.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="../index.html">
      <img src="../img/logo.svg" alt="" width="36" height="36">
      Biblioteca
    </a>
    <nav aria-label="Principal">
      <ul class="menu">
        <li><a href="libros.html">Catálogo</a></li>
        <li><a href="autores.html">Autores</a></li>
        <li data-sin-sesion><a href="login.html" aria-current="page">Iniciar sesión</a></li>
        <li data-sin-sesion><a href="registro.html">Crear cuenta</a></li>
        <li data-con-sesion hidden><a href="perfil.html" id="enlace-perfil">Mi perfil</a></li>
        <li data-con-sesion hidden>
          <button type="button" class="boton-enlace" id="boton-salir">Cerrar sesión</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="contenedor angosto">
    <h1>Iniciar sesión</h1>
    <p class="destacado">Ingrese con el correo y la contraseña de su cuenta.</p>

    <form id="form-login" class="formulario">
      <label for="correo">Correo</label>
      <input type="email" id="correo" autocomplete="email" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" autocomplete="current-password"
             required>

      <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje" class="mensaje" role="status"></p>
    <p>¿No tiene cuenta? <a href="registro.html">Cree una aquí</a>.</p>
  </main>

  <footer class="pie">
    <p>Biblioteca · Proyecto del curso Capstone</p>
  </footer>
</body>
</html>
