<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca | Autores</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <script src="../js/api.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/autores.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="../index.html">
      <img src="../img/logo.svg" alt="" width="36" height="36">
      Biblioteca
    </a>
    <nav aria-label="Principal">
      <ul class="menu">
        <li><a href="libros.html">Catálogo</a></li>
        <li><a href="autores.html" aria-current="page">Autores</a></li>
        <li data-sin-sesion><a href="login.html">Iniciar sesión</a></li>
        <li data-sin-sesion><a href="registro.html">Crear cuenta</a></li>
        <li data-con-sesion hidden><a href="perfil.html" id="enlace-perfil">Mi perfil</a></li>
        <li data-con-sesion hidden>
          <button type="button" class="boton-enlace" id="boton-salir">Cerrar sesión</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="contenedor">
    <h1>Autores</h1>
    <p class="destacado">Personas que escribieron los libros del catálogo.</p>

    <h2 id="titulo-lista">Lista de autores</h2>
    <p id="estado" class="estado" role="status">Cargando autores…</p>
    <section id="lista-autores" class="tarjetas"
             aria-labelledby="titulo-lista"></section>

    <h2 id="titulo-formulario">Registrar un autor</h2>
    <form id="form-autor" class="formulario">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>

      <label for="nacionalidad">Nacionalidad</label>
      <input type="text" id="nacionalidad" required>

      <label for="biografia">Biografía</label>
      <textarea id="biografia" rows="3"></textarea>

      <div class="acciones">
        <button type="submit" id="boton-guardar">Registrar autor</button>
        <button type="button" id="boton-cancelar" class="secundario" hidden>
          Cancelar
        </button>
      </div>
    </form>
    <p id="mensaje" class="mensaje" role="status"></p>
  </main>

  <footer class="pie">
    <p>Biblioteca · Proyecto del curso Capstone</p>
  </footer>
</body>
</html>
